[pytest]
testpaths = tests
pythonpath = src .
markers =
    smoke: fast, high-value checks to run first
    regression: broader checks, including negative and edge cases
    api: REST API tests against the public Restful Booker host (needs network)
    ui: Playwright UI tests against the public Sauce Demo store (needs Chromium)
addopts =
    -ra
    -v
    --strict-markers
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
junit_family = xunit2
