[pytest]
testpaths = tests
pythonpath = src .
markers =
    smoke: fast, high-value checks to run first
    regression: broader checks, including negative and edge cases
addopts =
    -ra
    -v
    --strict-markers
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
junit_family = xunit2
